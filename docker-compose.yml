name: volunteer-shifts

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
      POSTGRES_DB: volunteer_shifts
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U volunteer -d volunteer_shifts']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://volunteer:volunteer@db:5432/volunteer_shifts
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Creates coordinator@example.org and volunteer@example.org (password: demo-password)
      # with a few events on first start.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-4420}:80'

volumes:
  db-data:
