name: volunteer-shifts

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
      POSTGRES_DB: volunteer_shifts
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U volunteer -d volunteer_shifts']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://volunteer:volunteer@db:5432/volunteer_shifts
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Creates coordinator@example.org and volunteer@example.org (password: demo-password)
      # with a few events on first start.
      SEED_DEMO: ${SEED_DEMO:-true}
      SMTP_URL: smtp://mailpit:1025
      APP_URL: http://localhost:${WEB_PORT:-4420}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Catches every email the app sends; browse them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-4420}:80'

volumes:
  db-data:
